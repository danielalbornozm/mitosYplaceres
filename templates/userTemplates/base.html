<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row mb-5">
            <div class="col">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="#">Proyecto</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                            aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNavDropdown">
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" href="{% url 'inicio' %}">Inicio</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="{% url 'listaUsuarios' %}">Clientes</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">Trabajadores</a>
                                </li>
                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                        aria-expanded="True">Productos</a>
                                    <ul class="dropdown-menu">
                                        <li>
                                            <a class="dropdown-item" href="{% url 'userAdd' %}">Agregar
                                                Usuario</a>
                                        </li>
                                    </ul>
                                </li>
                            {% if user.is_authenticated %}
                                <li class="nav-item">
                                    <a class="nav-link text-danger" href="{% url 'logout' %}">Cerrar Sesion</a>
                                </li>
                            {% else %}
                                <li class="nav-item">
                                    <a class="nav-link text-warning" href="{% url 'login' %}">Inciar Sesion</a>
                                </li>
                            {% endif %}    
                            </ul>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
        <main>
            {% block contenido %}{% endblock %}
        </main>
    </div>
    <footer>
        <script src="{% static 'js/bootstrap.min.js' %}"></script> 
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script> 
    </footer>
</body>
</html>
