{% extends "frontEnd/base.html" %}
{% load static %}
{% load humanize %}
{% load crispy_forms_tags %}

{% block titulo %}
    Inicio de sesión - Intranet
{% endblock titulo %}

{% block contenido %}

<!-- Formulario -->
<div class="container-fluid mt-3 mb-3">
    <div class="row">
        <div class="col-7">
            Imagen
        </div>
        <div class="col-5">
            <div class="card shadow-lg" style="width: 18rem;">
                <div class="card-header">Inicio de sesión</div>
                <div class="card-body">
                    <form action="" method="POST">
                        {% csrf_token %}
                        {{ form | crispy }}
                        <div class="d-flex justify-content-center">
                            <input class="btn btn-outline-dark" type="reset" value="Cancelar">&nbsp;
                            <input class="btn btn-outline-dark" type="submit" value="Iniciar sesion">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock contenido %}
