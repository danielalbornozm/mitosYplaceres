<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block titulo %}{% endblock titulo %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body style="background-color: #D96690;">
    <div class="container-fluid">
        <div class="row">
          <nav class="navbar navbar-expand-lg justify-content-center" style="background-color: #B3124D">
            <a class="navbar-brand" href="{% url 'inicio' %}">
              <img src="{% static 'images/frontEnd/logo.png' %}" alt="Logo Mitos y Placeres" width="100px" height="auto">
            </a>
          </nav>
        </div>
        <div class="row">
          <nav class="navbar navbar-expand-lg d-flex justify-content-center" style="background-color: #D96690">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#">Somos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Inicio de sesión</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Contacto</a>
                </li>
            </ul>
          </nav>
        </div>
      </div>      
      {% block contenido %}{% endblock contenido %}
    </div>

    {% block js %}{% endblock js %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
